# rubyfmt corpus manifest.
# Each project is pinned to a full commit SHA.
# Bump a SHA with: ruby corpus/tool/corpus bump <name> [sha-or-ref]
# Validate with:   ruby corpus/tool/corpus validate
---
- name: activeadmin
  url: https://github.com/activeadmin/activeadmin
  sha: 62bf0e6e6c961af02d940ff86367706fe120c3c9
  kind: gem
  tier: full
  include: &ruby_includes
    - "**/*.rb"
    - "**/*.rake"
    - "**/*.gemspec"
    - "**/Rakefile"
    - "**/Gemfile"
    - "**/config.ru"
  exclude: &ruby_excludes
    - "**/.git/**"
    - "**/vendor/**"
    - "**/node_modules/**"
    - "**/tmp/**"
    - "**/coverage/**"
    - "**/fixtures/**"

